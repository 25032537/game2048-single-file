<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>2048 · 华为云开放能力闯关</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1b2740; --cell:#26344f; --txt:#e8eefc; --muted:#8ea2c6;
    --accent:#3ba7ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1d3a63 0%,var(--bg) 60%);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",
      "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:16px;touch-action:none;overflow:hidden;
  }
  .wrap{width:100%;max-width:420px}
  header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:10px}
  h1{font-size:34px;margin:0;letter-spacing:-1px;font-weight:800;
     background:linear-gradient(135deg,#7fd2ff,#3ba7ff 55%,#8b7dff);
     -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.4px}
  .scores{display:flex;gap:8px}
  .score{background:var(--panel);border:1px solid rgba(255,255,255,.07);
    border-radius:10px;padding:7px 12px;min-width:74px;text-align:center}
  .score .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .score .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .toolbar{display:flex;gap:8px;margin-bottom:10px}
  button{
    font:inherit;font-size:13px;font-weight:600;color:var(--txt);cursor:pointer;
    background:var(--panel);border:1px solid rgba(255,255,255,.09);
    border-radius:9px;padding:9px 14px;transition:transform .07s,background .15s;
  }
  button:hover{background:#24324f}
  button:active{transform:scale(.96)}
  #new{background:linear-gradient(135deg,#2f7fe0,#3ba7ff);border-color:transparent}
  #parent{flex:1}
  .board{
    position:relative;background:var(--panel);border-radius:14px;padding:10px;
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 20px 50px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);
    aspect-ratio:1/1;
  }
  .grid,.tiles{position:absolute;inset:10px;display:grid;
    grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
  .grid div{background:var(--cell);border-radius:9px}
  .tile{
    display:flex;align-items:center;justify-content:center;border-radius:9px;
    font-weight:800;font-variant-numeric:tabular-nums;
    transition:transform .1s ease,opacity .1s ease;
    will-change:transform;user-select:none;
  }
  .tile.s2{background:#31456b;color:#cfe0ff}
  .tile.s4{background:#335585;color:#e6f1ff}
  .tile.s8{background:#2f7fe0;color:#fff}
  .tile.s16{background:#3ba7ff;color:#04203a}
  .tile.s32{background:#37c2e0;color:#04202c}
  .tile.s64{background:#35d0b0;color:#03281f}
  .tile.s128{background:#7fd85a;color:#0c2a06;box-shadow:0 0 22px rgba(127,216,90,.4)}
  .tile.s256{background:#c9e04f;color:#26280a;box-shadow:0 0 24px rgba(201,224,79,.45)}
  .tile.s512{background:#f2c14e;color:#2b1d00;box-shadow:0 0 26px rgba(242,193,78,.5)}
  .tile.s1024{background:#f79a3e;color:#2b1300;box-shadow:0 0 28px rgba(247,154,62,.55)}
  .tile.s2048{background:#f56b6b;color:#fff;box-shadow:0 0 34px rgba(245,107,107,.65)}
  .tile.big{background:#a855f7;color:#fff;box-shadow:0 0 34px rgba(168,85,247,.6)}
  .tile.pop{animation:pop .16s ease}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  .over{
    position:absolute;inset:0;border-radius:14px;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(10,18,32,.82);backdrop-filter:blur(6px);z-index:5;
  }
  .over.show{display:flex;animation:pop .2s ease}
  .over h2{margin:0;font-size:28px;letter-spacing:-.5px}
  footer{margin-top:12px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
  kbd{background:#22304c;border:1px solid rgba(255,255,255,.12);border-bottom-width:2px;
    border-radius:5px;padding:1px 5px;font-size:10px;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>2048</h1>
      <div class="sub">合并数字，挑战 2048</div>
    </div>
    <div class="scores">
      <div class="score"><div class="k">分数</div><div class="v" id="score">0</div></div>
      <div class="score"><div class="k">最高</div><div class="v" id="best">0</div></div>
    </div>
  </header>

  <div class="toolbar">
    <button id="new">重新开始</button>
    <button id="parent">分享成绩</button>
  </div>

  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
    <div class="over" id="over">
      <h2 id="overTitle">游戏结束</h2>
      <div id="overSub" style="color:var(--muted);font-size:13px">得分 <b id="finalScore">0</b></div>
      <button id="again">再来一局</button>
    </div>
  </div>

  <footer>方向键 / WASD 操作 · 手机滑动屏幕<br>单文件部署于华为云</footer>
</div>

<script>
(function(){
  "use strict";
  var N = 4;
  var boardEl = document.getElementById('board');
  var gridEl  = document.getElementById('grid');
  var tilesEl = document.getElementById('tiles');
  var scoreEl = document.getElementById('score');
  var bestEl  = document.getElementById('best');
  var overEl  = document.getElementById('over');

  for (var i = 0; i < N * N; i++) gridEl.appendChild(document.createElement('div'));

  var grid, score, best, won, over, busy;

  best = 0;
  try { best = parseInt(localStorage.getItem('best2048') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function empty() {
    var a = [];
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (!grid[r][c]) a.push([r, c]);
    return a;
  }

  function addRandom() {
    var cells = empty();
    if (!cells.length) return null;
    var p = cells[Math.floor(Math.random() * cells.length)];
    var v = Math.random() < 0.9 ? 2 : 4;
    grid[p[0]][p[1]] = v;
    return { r: p[0], c: p[1], v: v, isNew: true };
  }

  function reset() {
    grid = [];
    for (var r = 0; r < N; r++) {
      grid.push([]);
      for (var c = 0; c < N; c++) grid[r].push(0);
    }
    score = 0; won = false; over = false; busy = false;
    overEl.classList.remove('show');
    scoreEl.textContent = '0';
    addRandom();
    addRandom();
    render();
  }

  // 几何计算：把格子索引换算成像素位置
  function metrics() {
    var rect = tilesEl.getBoundingClientRect();
    var gap = Math.max(6, Math.round(rect.width * 0.024));
    var size = (rect.width - gap * (N - 1)) / N;
    return { left: rect.left, top: rect.top, gap: gap, size: size };
  }

  function render(newCells) {
    var m = metrics();
    var frag = document.createDocumentFragment();
    var fresh = {};
    if (newCells) for (var i = 0; i < newCells.length; i++) {
      var nc = newCells[i];
      fresh[nc.r + ',' + nc.c] = true;
    }
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var v = grid[r][c];
        if (!v) continue;
        var d = document.createElement('div');
        var cls = v <= 2048 ? ('s' + v) : 'big';
        d.className = 'tile ' + cls + (fresh[r + ',' + c] ? ' pop' : '');
        d.textContent = v;
        d.style.position = 'absolute';
        d.style.width = m.size + 'px';
        d.style.height = m.size + 'px';
        d.style.left = (m.gap + c * (m.size + m.gap)) + 'px';
        d.style.top  = (m.gap + r * (m.size + m.gap)) + 'px';
        var digits = String(v).length;
        var fs = m.size * (digits <= 2 ? 0.42 : digits === 3 ? 0.34 : digits === 4 ? 0.27 : 0.21);
        d.style.fontSize = fs + 'px';
        frag.appendChild(d);
      }
    }
    tilesEl.textContent = '';
    tilesEl.appendChild(frag);
  }

  function canMove() {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      if (!grid[r][c]) return true;
      if (c + 1 < N && grid[r][c] === grid[r][c + 1]) return true;
      if (r + 1 < N && grid[r][c] === grid[r + 1][c]) return true;
    }
    return false;
  }

  // 单行向左合并；返回 {row, gain, moved}
  function slideRow(row) {
    var out = [];
    var gain = 0;
    var moved = false;
    for (var i = 0; i < row.length; i++) if (row[i]) out.push(row[i]);
    var merged = [];
    for (var k = 0; k < out.length; k++) {
      if (k + 1 < out.length && out[k] === out[k + 1]) {
        var v = out[k] * 2;
        merged.push(v);
        gain += v;
        if (v >= 2048) won = true;
        k++;
      } else {
        merged.push(out[k]);
      }
    }
    while (merged.length < N) merged.push(0);
    for (var j = 0; j < N; j++) if (merged[j] !== row[j]) moved = true;
    return { row: merged, gain: gain, moved: moved };
  }

  function move(dir) {
    // dir: 0=up 1=right 2=down 3=left
    if (busy || over) return;
    var moved = false;
    var gain = 0;
    var work = [];
    var r, c;

    if (dir === 3 || dir === 1) {
      // 水平：向左处理或向右翻转
      for (r = 0; r < N; r++) {
        var line = [];
        for (c = 0; c < N; c++) line.push(grid[r][c]);
        var src = dir === 3 ? line : line.slice().reverse();
        var res = slideRow(src);
        var outRow = dir === 3 ? res.row : res.row.slice().reverse();
        if (res.moved) moved = true;
        gain += res.gain;
        work.push(['r', r, outRow]);
      }
    } else {
      for (c = 0; c < N; c++) {
        var col = [];
        for (r = 0; r < N; r++) col.push(grid[r][c]);
        var src2 = dir === 0 ? col : col.slice().reverse();
        var res2 = slideRow(src2);
        var outCol = dir === 0 ? res2.row : res2.row.slice().reverse();
        if (res2.moved) moved = true;
        gain += res2.gain;
        work.push(['c', c, outCol]);
      }
    }

    if (!moved) return;

    for (var i = 0; i < work.length; i++) {
      var kind = work[i][0], idx = work[i][1], line = work[i][2];
      for (var j = 0; j < N; j++) {
        if (kind === 'r') grid[idx][j] = line[j];
        else grid[j][idx] = line[j];
      }
    }

    score += gain;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('best2048', String(best)); } catch (e) {}
    }

    addRandom();
    render();

    if (won && !over) {
      // 达成 2048 不结束，继续玩
      won = true;
    }
    if (!canMove()) {
      over = true;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('overTitle').textContent = '游戏结束';
      overEl.classList.add('show');
    }
  }

  // 键盘
  var keys = {
    ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3,
    w: 0, d: 1, s: 2, a: 3, W: 0, D: 1, S: 2, A: 3
  };
  document.addEventListener('keydown', function (e) {
    if (keys.hasOwnProperty(e.key)) {
      e.preventDefault();
      move(keys[e.key]);
    }
  });

  // 触屏
  var sx = 0, sy = 0, tracking = false;
  boardEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    tracking = true;
  }, { passive: true });

  boardEl.addEventListener('touchmove', function (e) {
    if (tracking) e.preventDefault();
  }, { passive: false });

  boardEl.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx;
    var dy = t.clientY - sy;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    if (ax > ay) move(dx > 0 ? 1 : 3);
    else move(dy > 0 ? 2 : 0);
  }, { passive: true });

  // 鼠标拖拽（桌面也能玩）
  var md = false, mx = 0, my = 0;
  boardEl.addEventListener('mousedown', function (e) {
    md = true; mx = e.clientX; my = e.clientY;
  });
  window.addEventListener('mouseup', function (e) {
    if (!md) return;
    md = false;
    var dx = e.clientX - mx, dy = e.clientY - my;
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (Math.max(ax, ay) < 24) return;
    if (ax > ay) move(dx > 0 ? 1 : 3);
    else move(dy > 0 ? 2 : 0);
  });

  document.getElementById('new').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  document.getElementById('parent').addEventListener('click', function () {
    var txt = '我在 2048 拿到 ' + score + ' 分，最高 ' + best + ' 分！';
    if (navigator.share) navigator.share({ title: '2048', text: txt })
      .catch(function () {});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () {
      var b = document.getElementById('parent');
      var old = b.textContent;
      b.textContent = '已复制！';
      setTimeout(function () { b.textContent = old; }, 1200);
    }).catch(function () {});
  });

  window.addEventListener('resize', function () { render(); });

  reset();
})();
</script>
</body>
</html>
